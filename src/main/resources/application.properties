#アプリケーション名
spring.application.name=CardCapture-back

# ログファイルの出力先パス指定（相対パスまたは絶対パス）
logging.file.name=logs/app.log

# ログレベルの設定（必要に応じてパッケージごとに変更）
logging.level.root=INFO
logging.level.com.example.demo=DEBUG

# ログローテーション設定（SpringBoot 2.2+ / 3.x）
# 1ファイルの最大サイズ（超えると連番で分割）
logging.logback.rollingpolicy.max-file-size=10MB

# バックアップファイルの命名パターン（日付やインデックス）
logging.logback.rollingpolicy.file-name-pattern=logs/archived/app-%d{yyyy-MM-dd}.%i.log

# ログファイルの保存期間（日数）
logging.logback.rollingpolicy.max-history=30

# ログファイルの総容量制限
logging.logback.rollingpolicy.total-size-cap=1GB